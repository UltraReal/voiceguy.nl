            <form action="login.php" method="POST" class="form">

                    <label for="username">Gebruikersnaam</label>
                    <input type="text" id="username" name="username" placeholder="Voer je gebruikersnaam in" required>

                </div>
                <div class="input-group">
                    <label for="password">Wachtwoord</label>
                    <input type="password" id="password" name="password" placeholder="Voer je wachtwoord in" required>
                    <i class="fas fa-lock"></i>
                </div>
                <div class="input-group" style="text-align: right;">
                    <a href="#" style="color: #aaa; font-size: 14px; text-decoration: none;">Wachtwoord vergeten?</a>
                </div>
                <button type="submit" class="cta-button">Inloggen</button>
            </form>
            <div class="form-footer">
                Nog geen account? <a href="register.html">Registreer nu</a>
            </div>
        </section>
